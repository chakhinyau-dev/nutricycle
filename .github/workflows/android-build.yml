name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_CLERK_SUPABASE_JWT_TEMPLATE: ${{ secrets.EXPO_PUBLIC_CLERK_SUPABASE_JWT_TEMPLATE }}
      EXPO_PUBLIC_APP_SCHEME: ${{ secrets.EXPO_PUBLIC_APP_SCHEME }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_STRIPE_MONTHLY_PRICE_LOOKUP_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_MONTHLY_PRICE_LOOKUP_KEY }}
      EXPO_PUBLIC_STRIPE_ANNUAL_PRICE_LOOKUP_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_ANNUAL_PRICE_LOOKUP_KEY }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
    # defaults:
    #   run:
    #     working-directory: nutricycle_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Expo prebuild (Android)
        run: bunx expo prebuild --platform android --no-install --clean
        env:
          CI: '1'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sign release with debug keystore (no real keys needed)
        run: |
          # Make the release build type reuse the debug signing config so the
          # APK is installable without managing a real keystore.
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          grep -n "signingConfig" android/app/build.gradle || true

      - name: Build release APK (JS bundled, installable)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutricycle-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Rename APK for release
        run: cp "${{ steps.apk.outputs.path }}" nutricycle-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            "nutricycle-${{ github.run_number }}.apk" \
            --title "NutriCycle Release v${{ github.run_number }}" \
            --notes "Automated debug APK build from commit ${{ github.sha }}.
            
            Install on Android: download the APK below and open it on your device (enable 'Install from unknown sources')."

