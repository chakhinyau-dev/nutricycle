name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛡️ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🚀 Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: android
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_CLERK_SUPABASE_JWT_TEMPLATE: ${{ secrets.EXPO_PUBLIC_CLERK_SUPABASE_JWT_TEMPLATE }}
          EXPO_PUBLIC_APP_SCHEME: ${{ secrets.EXPO_PUBLIC_APP_SCHEME }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_STRIPE_MONTHLY_PRICE_LOOKUP_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_MONTHLY_PRICE_LOOKUP_KEY }}
          EXPO_PUBLIC_STRIPE_ANNUAL_PRICE_LOOKUP_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_ANNUAL_PRICE_LOOKUP_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NutriCycle-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
